<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스네이크 게임</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #1a1a2e;
      color: #fff;
      font-family: 'Courier New', monospace;
    }
    h1 { margin-bottom: 10px; }
    canvas {
      border: 2px solid #4ecca3;
      background: #16213e;
      box-shadow: 0 0 20px rgba(78, 204, 163, 0.3);
    }
    .score { font-size: 24px; margin: 10px 0; }
    .controls { margin-top: 15px; color: #aaa; font-size: 14px; }
  </style>
</head>
<body>
  <h1>🐍 스네이크 게임</h1>
  <div class="score">점수: <span id="score">0</span></div>
  <canvas id="game" width="400" height="400"></canvas>
  <div class="controls">방향키로 이동 | 스페이스바로 재시작</div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');

    const grid = 20;
    const tileCount = canvas.width / grid;

    let snake = [{ x: 10, y: 10 }];
    let food = { x: 15, y: 15 };
    let dx = 0;
    let dy = 0;
    let score = 0;
    let gameLoop;
    let isGameOver = false;

    function init() {
      snake = [{ x: 10, y: 10 }];
      food = { x: Math.floor(Math.random() * tileCount), y: Math.floor(Math.random() * tileCount) };
      dx = 0;
      dy = 0;
      score = 0;
      isGameOver = false;
      scoreEl.textContent = score;
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(update, 100);
    }

    function update() {
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      if (dx === 0 && dy === 0) return;

      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        isGameOver = true;
      }

      for (let i = 0; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          isGameOver = true;
        }
      }

      if (isGameOver) {
        clearInterval(gameLoop);
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff6b6b';
        ctx.font = '30px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('게임 오버!', canvas.width / 2, canvas.height / 2);
        ctx.fillStyle = '#fff';
        ctx.font = '16px Courier New';
        ctx.fillText('스페이스바를 누르세요', canvas.width / 2, canvas.height / 2 + 30);
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        food = {
          x: Math.floor(Math.random() * tileCount),
          y: Math.floor(Math.random() * tileCount)
        };
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      ctx.fillStyle = '#16213e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#ff6b6b';
      ctx.fillRect(food.x * grid, food.y * grid, grid - 2, grid - 2);

      ctx.fillStyle = '#4ecca3';
      snake.forEach((part, i) => {
        ctx.fillRect(part.x * grid, part.y * grid, grid - 2, grid - 2);
      });
    }

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && isGameOver) {
        init();
        return;
      }

      switch (e.key) {
        case 'ArrowUp':
          if (dy !== 1) { dx = 0; dy = -1; }
          break;
        case 'ArrowDown':
          if (dy !== -1) { dx = 0; dy = 1; }
          break;
        case 'ArrowLeft':
          if (dx !== 1) { dx = -1; dy = 0; }
          break;
        case 'ArrowRight':
          if (dx !== -1) { dx = 1; dy = 0; }
          break;
      }
    });

    draw();
    ctx.fillStyle = '#fff';
    ctx.font = '20px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('방향키를 누르세요', canvas.width / 2, canvas.height / 2);
  </script>
</body>
</html>
